<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Map - 全画面表示</title>

    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Kiwi+Maru&display=swap" rel="stylesheet">

    <!-- ===== Leaflet（地図ライブラリ） ===== -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            font-family: 'Kiwi Maru', 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #eee;
            overflow: hidden;
        }

        /* ===== 全画面コンテナ ===== */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: #1a1a2e;
        }

        /* ===== ヘッダー ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.5rem;
            background: rgba(26, 26, 46, 0.92);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 0.5rem;
            z-index: 10;
        }
        .header-left {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
        }
        .header h1 {
            font-family: 'Mochiy Pop One', sans-serif;
            font-size: 1.4rem;
            color: #ffb3c6;
            letter-spacing: 1px;
        }
        .header .sub {
            color: #aaa;
            font-size: 0.8rem;
        }
        .header-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
        }
        .header-controls input {
            background: #252540;
            border: 1px solid #444;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            color: #fff;
            font-size: 0.8rem;
            font-family: 'Kiwi Maru', sans-serif;
            outline: none;
            transition: border-color 0.3s;
            min-width: 100px;
            max-width: 160px;
        }
        .header-controls input:focus {
            border-color: #ffb3c6;
        }
        .header-controls input::placeholder {
            color: #666;
        }
        .header-controls button {
            background: #ffb3c6;
            color: #1a1a2e;
            border: none;
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-family: 'Mochiy Pop One', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .header-controls button:hover {
            background: #ff8fab;
            transform: scale(1.02);
        }
        .header-controls button:active {
            transform: scale(0.96);
        }
        .header-controls .btn-secondary {
            background: #444;
            color: #eee;
        }
        .header-controls .btn-secondary:hover {
            background: #555;
        }

        /* ===== 地図エリア（全画面の残り） ===== */
        .map-wrapper {
            flex: 1;
            position: relative;
            min-height: 0;
        }
        #map {
            width: 100%;
            height: 100%;
            border: none;
            background: #1a1a2e;
        }

        /* ===== 情報パネル（地図上に重ねる） ===== */
        .info-panel {
            position: absolute;
            bottom: 1.5rem;
            left: 1.5rem;
            right: 1.5rem;
            background: rgba(20, 20, 38, 0.88);
            backdrop-filter: blur(8px);
            border: 1px solid #444;
            border-radius: 14px;
            padding: 0.9rem 1.2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            pointer-events: auto;
            z-index: 1000;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
            transition: opacity 0.25s;
        }
        .info-panel .info-left {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.5rem;
            font-size: 0.85rem;
            line-height: 1.6;
        }
        .info-panel .label {
            color: #888;
            font-size: 0.6rem;
            font-family: 'Mochiy Pop One', sans-serif;
            letter-spacing: 1px;
            display: block;
        }
        .info-panel .value {
            color: #ddd;
            word-break: break-all;
        }
        .info-panel .value .highlight {
            color: #ffb3c6;
            font-weight: bold;
        }
        .info-panel .info-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .info-panel .info-actions button {
            background: #333;
            color: #eee;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-family: 'Mochiy Pop One', sans-serif;
            cursor: pointer;
            transition: background 0.2s;
        }
        .info-panel .info-actions button:hover {
            background: #555;
        }

        /* ===== ローディングスピナー ===== */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #1a1a2e;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 4px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== レスポンシブ ===== */
        @media (max-width: 720px) {
            .header {
                padding: 0.5rem 0.8rem;
            }
            .header h1 {
                font-size: 1.1rem;
            }
            .header .sub {
                display: none;
            }
            .header-controls input {
                min-width: 70px;
                max-width: 120px;
                font-size: 0.7rem;
                padding: 0.3rem 0.6rem;
            }
            .header-controls button {
                font-size: 0.65rem;
                padding: 0.3rem 0.6rem;
            }
            .info-panel {
                bottom: 0.8rem;
                left: 0.8rem;
                right: 0.8rem;
                padding: 0.7rem 0.9rem;
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
                border-radius: 12px;
            }
            .info-panel .info-left {
                font-size: 0.75rem;
                gap: 0.3rem 1rem;
            }
            .info-panel .info-actions {
                justify-content: flex-start;
            }
            .info-panel .info-actions button {
                font-size: 0.6rem;
                padding: 0.2rem 0.6rem;
            }
        }

        @media (max-width: 480px) {
            .header-controls input {
                min-width: 60px;
                max-width: 100px;
            }
            .header-controls .hide-mobile {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ===== ヘッダー ===== -->
        <header class="header">
            <div class="header-left">
                <h1>🗺️ 地図</h1>
                <span class="sub">現在地・住所検索</span>
            </div>
            <div class="header-controls">
                <input type="text" id="addressInput" placeholder="住所検索" />
                <button id="searchBtn">検索</button>
                <button id="currentBtn" class="btn-secondary">📍 現在地</button>

                <input type="text" id="latInput" placeholder="緯度" class="hide-mobile" />
                <input type="text" id="lngInput" placeholder="経度" class="hide-mobile" />
                <button id="coordBtn" class="btn-secondary hide-mobile">移動</button>
                <button id="resetBtn" class="btn-secondary" style="background:#333;">✕</button>
            </div>
        </header>

        <!-- ===== 地図 ===== -->
        <div class="map-wrapper">
            <div id="map"></div>

            <!-- ===== 情報パネル（地図上） ===== -->
            <div class="info-panel" id="infoPanel">
                <div class="info-left">
                    <div>
                        <span class="label">📍 座標</span>
                        <div class="value" id="coordDisplay">緯度: -- / 経度: --</div>
                    </div>
                    <div>
                        <span class="label">🏠 住所</span>
                        <div class="value" id="addressDisplay">--</div>
                    </div>
                </div>
                <div class="info-actions">
                    <button id="copyCoordBtn">座標をコピー</button>
                    <button id="copyAddressBtn">住所をコピー</button>
                    <span style="font-size:0.6rem;color:#555;align-self:center;">地図クリックで取得</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        // ★★★ 地図初期化 ★★★
        // ================================================================
        const map = L.map('map', {
            zoomControl: true,
            fadeAnimation: true,
            attributionControl: true,
        }).setView([35.6812, 139.7671], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // カスタムマーカー（デフォルトのままでもOK）
        let marker = null;
        let currentLat = 35.6812;
        let currentLng = 139.7671;
        let currentAddress = '';

        // ================================================================
        // ★★★ マーカー更新 ★★★
        // ================================================================
        function updateMarker(lat, lng, address) {
            if (marker) {
                marker.setLatLng([lat, lng]);
            } else {
                marker = L.marker([lat, lng], {
                    draggable: false
                }).addTo(map);
            }
            map.setView([lat, lng], 15);
            currentLat = lat;
            currentLng = lng;
            currentAddress = address || '';

            document.getElementById('coordDisplay').innerHTML =
                '緯度: <span class="highlight">' + lat.toFixed(6) + '</span> / 経度: <span class="highlight">' + lng.toFixed(6) +
                '</span>';

            if (address) {
                document.getElementById('addressDisplay').innerHTML =
                    '<span class="highlight">' + address + '</span>';
            } else {
                document.getElementById('addressDisplay').innerHTML = '--';
            }
        }

        // ================================================================
        // ★★★ 住所→緯度経度（Geocoding） ★★★
        // ================================================================
        async function searchAddress(address) {
            if (!address.trim()) {
                alert('住所を入力してください');
                return;
            }

            const btn = document.getElementById('searchBtn');
            const original = btn.innerHTML;
            btn.innerHTML = '<span class="spinner"></span>';
            btn.disabled = true;

            try {
                const url = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(address) +
                    '&countrycodes=jp&limit=1';
                const response = await fetch(url);
                const data = await response.json();

                if (data.length === 0) {
                    alert('住所が見つかりませんでした');
                    return;
                }

                const lat = parseFloat(data[0].lat);
                const lng = parseFloat(data[0].lon);
                const displayName = data[0].display_name;

                updateMarker(lat, lng, displayName);
                document.getElementById('addressInput').value = displayName;

            } catch (error) {
                alert('検索エラー: ' + error.message);
            } finally {
                btn.innerHTML = original;
                btn.disabled = false;
            }
        }

        // ================================================================
        // ★★★ 現在地取得 ★★★
        // ================================================================
        function getCurrentLocation() {
            if (!navigator.geolocation) {
                alert('このブラウザは位置情報に対応していません');
                return;
            }

            const btn = document.getElementById('currentBtn');
            const original = btn.innerHTML;
            btn.innerHTML = '<span class="spinner"></span>';
            btn.disabled = true;

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    updateMarker(lat, lng, '');

                    try {
                        const url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng;
                        const response = await fetch(url);
                        const data = await response.json();
                        if (data.display_name) {
                            currentAddress = data.display_name;
                            document.getElementById('addressDisplay').innerHTML =
                                '<span class="highlight">' + data.display_name + '</span>';
                        }
                    } catch {}

                    btn.innerHTML = original;
                    btn.disabled = false;
                },
                (error) => {
                    alert('位置情報を取得できませんでした: ' + error.message);
                    btn.innerHTML = original;
                    btn.disabled = false;
                }
            );
        }

        // ================================================================
        // ★★★ 逆ジオコーディング ★★★
        // ================================================================
        async function reverseGeocode(lat, lng) {
            try {
                const url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng;
                const response = await fetch(url);
                const data = await response.json();
                if (data.display_name) {
                    currentAddress = data.display_name;
                    document.getElementById('addressDisplay').innerHTML =
                        '<span class="highlight">' + data.display_name + '</span>';
                    document.getElementById('addressInput').value = data.display_name;
                }
                return data.display_name || '';
            } catch {
                return '';
            }
        }

        // ================================================================
        // ★★★ 緯度経度で移動 ★★★
        // ================================================================
        async function moveToCoordinates() {
            const lat = parseFloat(document.getElementById('latInput').value.trim());
            const lng = parseFloat(document.getElementById('lngInput').value.trim());

            if (isNaN(lat) || isNaN(lng)) {
                alert('有効な緯度・経度を入力してください');
                return;
            }
            if (lat < -90 || lat > 90 || lng < -180 || lng > 180) {
                alert('緯度は-90〜90、経度は-180〜180の範囲で入力してください');
                return;
            }

            const btn = document.getElementById('coordBtn');
            const original = btn.innerHTML;
            btn.innerHTML = '<span class="spinner"></span>';
            btn.disabled = true;

            updateMarker(lat, lng, '');
            await reverseGeocode(lat, lng);

            btn.innerHTML = original;
            btn.disabled = false;
        }

        // ================================================================
        // ★★★ コピー機能 ★★★
        // ================================================================
        function copyCoord() {
            const text = currentLat + ', ' + currentLng;
            navigator.clipboard.writeText(text).then(() => {
                alert('座標をコピーしました！\n' + text);
            }).catch(() => {
                // フォールバック
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                alert('座標をコピーしました！\n' + text);
            });
        }

        function copyAddress() {
            if (!currentAddress) {
                alert('住所がありません');
                return;
            }
            navigator.clipboard.writeText(currentAddress).then(() => {
                alert('住所をコピーしました！');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = currentAddress;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                alert('住所をコピーしました！');
            });
        }

        // ================================================================
        // ★★★ リセット ★★★
        // ================================================================
        function resetMap() {
            map.setView([35.6812, 139.7671], 13);
            if (marker) {
                marker.setLatLng([35.6812, 139.7671]);
            }
            currentLat = 35.6812;
            currentLng = 139.7671;
            currentAddress = '';
            document.getElementById('coordDisplay').innerHTML = '緯度: -- / 経度: --';
            document.getElementById('addressDisplay').innerHTML = '--';
            document.getElementById('addressInput').value = '';
            document.getElementById('latInput').value = '';
            document.getElementById('lngInput').value = '';
        }

        // ================================================================
        // ★★★ 地図クリック ★★★
        // ================================================================
        map.on('click', async (e) => {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            updateMarker(lat, lng, '');
            const address = await reverseGeocode(lat, lng);
            if (address) {
                document.getElementById('addressDisplay').innerHTML =
                    '<span class="highlight">' + address + '</span>';
            }
            document.getElementById('latInput').value = lat.toFixed(6);
            document.getElementById('lngInput').value = lng.toFixed(6);
        });

        // ================================================================
        // ★★★ イベントバインド ★★★
        // ================================================================
        document.getElementById('searchBtn').addEventListener('click', () => {
            searchAddress(document.getElementById('addressInput').value);
        });
        document.getElementById('currentBtn').addEventListener('click', getCurrentLocation);
        document.getElementById('coordBtn').addEventListener('click', moveToCoordinates);
        document.getElementById('copyCoordBtn').addEventListener('click', copyCoord);
        document.getElementById('copyAddressBtn').addEventListener('click', copyAddress);
        document.getElementById('resetBtn').addEventListener('click', resetMap);

        // Enterキー
        document.getElementById('addressInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('searchBtn').click();
        });
        document.getElementById('latInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('coordBtn').click();
        });
        document.getElementById('lngInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('coordBtn').click();
        });

        // ================================================================
        // ★★★ 初期マーカー（東京） ★★★
        // ================================================================
        updateMarker(35.6812, 139.7671, '');
    </script>

</body>
</html>
